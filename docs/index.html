<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirIQ SP Dashboard</title>
<meta name="description" content="Air quality in São Paulo, Brazil, with satellite data, machine learning and an AI agent that reads environmental regulations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.1.0/plotly.min.js"></script>
<script src="data.js"></script>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3ef; --surface-1: #fcfcfb; --border: #e3e1da;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7973;
  --grid: #ebe9e3;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --base: #9a988f; --soft: #b7d3f6;
  --accent-bg: #e8f1fc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #2e2d2a;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --grid: #2a2927;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --base: #77766f; --soft: #1c5cab;
    --accent-bg: #15263b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --border: #2e2d2a;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --grid: #2a2927;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --base: #77766f; --soft: #1c5cab;
  --accent-bg: #15263b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 32px 16px 64px; }
header h1 { font-size: clamp(28px, 4vw, 40px); margin: 0 0 6px; letter-spacing: -0.02em; }
header p { margin: 0; color: var(--text-secondary); max-width: 760px; }
header .links { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
a { color: var(--s1); }
.btn { display: inline-block; padding: 7px 14px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface-1); color: var(--text-primary); text-decoration: none; font-weight: 500; font-size: 14px; }
.btn:hover { border-color: var(--s1); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 28px 0 8px; }
.kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.kpi b { display: block; font-size: 26px; letter-spacing: -0.02em; }
.kpi span { color: var(--text-secondary); font-size: 13px; }
h2 { font-size: 21px; margin: 44px 0 4px; letter-spacing: -0.01em; }
.lead { color: var(--text-secondary); margin: 0 0 14px; max-width: 820px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 14px 6px; min-width: 0; }
.card h3 { font-size: 15px; margin: 0 0 2px; }
.card p { margin: 0 0 6px; color: var(--text-secondary); font-size: 13px; }
.chart { width: 100%; height: 380px; }
.chart.tall { height: 520px; }
.note { background: var(--accent-bg); border-radius: 10px; padding: 10px 14px; font-size: 14px; color: var(--text-primary); margin-top: 12px; }
select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); max-width: 100%; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; font-size: 13px; color: var(--text-secondary); }
footer { margin-top: 48px; color: var(--text-muted); font-size: 13px; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .chart.tall { height: 440px; } }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.lang { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
.lang button { font: inherit; font-size: 13px; padding: 5px 10px; border: 0; background: var(--surface-1); color: var(--text-secondary); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--s1); color: #fff; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--s1); margin-bottom: 6px; }
.agent { display: grid; grid-template-columns: 340px 1fr; gap: 16px; }
.qpanel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px; min-width: 0; }
.qpanel input { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-0); color: var(--text-primary); }
.qlist { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-height: 520px; overflow-y: auto; }
.qbtn { text-align: left; font: inherit; font-size: 13px; line-height: 1.4; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-0); color: var(--text-primary); cursor: pointer; }
.qbtn:hover, .qbtn:focus-visible { border-color: var(--s1); outline: none; }
.qbtn small { display: block; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
.linkbtn { font: inherit; font-size: 13px; background: none; border: 0; color: var(--s1); cursor: pointer; padding: 6px 0 0; }
.chat { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; min-height: 560px; max-height: 760px; min-width: 0; }
.chathead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-secondary); flex-wrap: wrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #1baf7a; margin-right: 6px; }
.replay { font-size: 11px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; color: var(--text-muted); }
.msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.bubble { max-width: 92%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.user { align-self: flex-end; background: var(--s1); color: #fff; border-bottom-right-radius: 4px; }
.bubble.bot { align-self: flex-start; background: var(--surface-0); border: 1px solid var(--border); border-bottom-left-radius: 4px; white-space: normal; }
.steps { list-style: none; margin: 0 0 8px; padding: 0; font-size: 13px; color: var(--text-secondary); }
.steps li { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; }
.steps .ic { width: 16px; flex-shrink: 0; text-align: center; }
.steps .detail { color: var(--text-muted); font-size: 12px; display: block; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--s1); border-radius: 50%; animation: sp .8s linear infinite; margin-top: 3px; }
@keyframes sp { to { transform: rotate(360deg); } }
.answer { white-space: pre-wrap; color: var(--text-primary); border-top: 1px dashed var(--border); padding-top: 8px; }
.caret::after { content: "▍"; color: var(--s1); animation: bl 1s steps(1) infinite; }
@keyframes bl { 50% { opacity: 0; } }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: 12px; }
.pill { border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; color: var(--text-secondary); }
.pill.ok { border-color: #1baf7a; color: #13865e; }
.pill.bad { border-color: #e34948; color: #c23a39; }
.bubble details { margin-top: 8px; font-size: 13px; }
.bubble details p { margin: 6px 0; padding: 8px 10px; background: var(--surface-1); border-left: 3px solid var(--s1); border-radius: 4px; white-space: pre-wrap; color: var(--text-secondary); }
.inputrow { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
.inputrow input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-0); color: var(--text-primary); }
.inputrow button, .cta { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 8px; border: 0; background: var(--s1); color: #fff; cursor: pointer; text-decoration: none; display: inline-block; }
.inputrow button:disabled { opacity: .5; cursor: default; }
.ptnote { font-size: 13px; color: var(--text-secondary); background: var(--accent-bg); border-radius: 10px; padding: 8px 12px; margin: 0 0 12px; }
@media (max-width: 820px) { .agent { grid-template-columns: 1fr; } .qlist { max-height: 260px; } .chat { min-height: 480px; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <div><span class="tag" data-i="tag"></span><h1>AirIQ SP</h1></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button>
    </div>
  </div>
  <p data-i="intro"></p>
  <div class="links">
    <a class="cta" href="#agent" data-i="try"></a>
    <a class="btn" href="https://github.com/LucasBetioli123/AirIQ-SP" data-i="code"></a>
    <a class="btn" href="https://github.com/LucasBetioli123/AirIQ-SP/blob/main/docs/TECHNICAL_DETAILS.md" data-i="deep"></a>
  </div>
</header>

<section class="kpis" id="kpis"></section>

<h2 data-i="h1"></h2>
<p class="lead" data-i="l1"></p>
<div class="grid">
  <div class="card"><h3 data-i="c_map"></h3><p data-i="c_map_s"></p><div id="map" class="chart tall"></div></div>
  <div class="card"><h3 data-i="c_series"></h3>
    <div class="row"><label for="station" data-i="station"></label><select id="station"></select></div>
    <div id="series" class="chart tall"></div></div>
</div>

<h2 data-i="h2"></h2>
<p class="lead" data-i="l2"></p>
<div class="grid">
  <div class="card"><h3 data-i="c_bench"></h3><p data-i="c_bench_s"></p><div id="bench" class="chart tall"></div></div>
  <div class="card"><h3 data-i="c_dist"></h3><p data-i="c_dist_s"></p><div id="dist" class="chart tall"></div></div>
</div>

<h2 data-i="h3"></h2>
<p class="lead" data-i="l3"></p>
<div class="grid">
  <div class="card"><h3 data-i="c_cov"></h3><p data-i="c_cov_s"></p><div id="cov" class="chart"></div></div>
  <div class="card"><h3 data-i="c_fc"></h3><p data-i="c_fc_s"></p><div id="fc" class="chart"></div></div>
</div>
<div class="grid" style="margin-top:16px">
  <div class="card"><h3 data-i="c_alert"></h3><p data-i="c_alert_s"></p><div id="alert" class="chart"></div></div>
  <div class="card"><h3 data-i="c_shap"></h3><p data-i="c_shap_s"></p><div id="shap" class="chart"></div></div>
</div>

<h2 data-i="h4"></h2>
<p class="lead" data-i="l4"></p>
<div class="grid">
  <div class="card"><h3 data-i="c_ret"></h3><p data-i="c_ret_s"></p><div id="ret" class="chart"></div></div>
  <div class="card"><h3 data-i="c_rag"></h3><p data-i="c_rag_s"></p><div id="rag" class="chart"></div></div>
</div>
<h2 id="agent" data-i="h5"></h2>
<p class="lead" data-i="l5"></p>
<p class="ptnote" data-i="ptnote"></p>
<div class="agent">
  <div class="qpanel">
    <input id="qsearch" type="search" data-ph="search_ph" aria-label="Search questions">
    <div class="qlist" id="qlist"></div>
    <button type="button" class="linkbtn" id="qmore"></button>
  </div>
  <div class="chat">
    <div class="chathead"><span><span class="dot"></span><span data-i="chat_title"></span></span><span class="replay" data-i="replay_badge"></span></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <form class="inputrow" id="askform">
      <input id="askinput" autocomplete="off" data-ph="ask_ph" aria-label="Question">
      <button id="askbtn" type="submit" data-i="send"></button>
    </form>
  </div>
</div>

<footer data-i="footer"></footer>
</div>

}

function kpis() {
  const best = D.benchmark.find(r => r.modelo.startsWith('LightGBM regularizado (offset'));

  const fi = far.find(r => r.modelo.startsWith('IDW')).MAE, fm = far.find(r => r.modelo.startsWith('LightGBM')).MAE;
  const cqr = D.intervals.find(r => r.recorte === 'todos' && r.metodo.startsWith('CQR'));
  const q = D.rag.find(r => r.modelo.startsWith('qwen3'));
  const items = [

}

let current = null;
function map() {
  const t = T(), s = D.stations, o = D.outline;

    { type: 'scatter', mode: 'lines', x: o.lon, y: o.lat, fill: 'toself', fillcolor: css('--accent-bg'), line: { color: t.text2, width: 1 }, hoverinfo: 'skip', showlegend: false },

}

function dist() {
  const t = T(), order = ['<10 km', '10-25 km', '25-50 km', '>50 km'];
  const mk = (prefix, name, color) => {
    const rows = order.map(g => D.distance.find(r => r.grupo === g && r.modelo.startsWith(prefix)));
    return { type: 'bar', name, x: order, y: rows.map(r => r.MAE), marker: { color, line: { color: t.surf, width: 2 } },

function cov() {
  const t = T(), c = D.coverage;
  Plotly.react('cov', [{
    type: 'bar', x: c.map(r => r.faixa + ' µg/m³'), y: c.map(r => r.cobertura_cqr), marker: { color: t.s1 }, customdata: c.map(r => [r.n, r.largura_cqr]),
    hovertemplate: `%{x}<br>${t_('coverage')} <b>%{y:.1%}</b><br>${t_('width')} %{customdata[1]:.1f} µg/m³<br>n=%{customdata[0]:.0f}<extra></extra>`
  }], L({ showlegend: false, yaxis: { tickformat: '.0%', range: [0.5, 1], gridcolor: t.grid, automargin: true }, xaxis: { title: { text: t_('band_axis') } },

}

function fc() {
  const t = T(), sc = ['A) local com estação', 'B) local sem estação'], lab = [t_('with_st'), t_('without_st')];
  const pick = re => sc.map(s => D.forecast.find(r => r.cenario === s && re.test(r.metodo)));
  const p = pick(/Persist/), m = pick(/LightGBM/);
  Plotly.react('fc', [
    { type: 'bar', name: t_('persist'), x: lab, y: p.map(r => r.MAE), marker: { color: t.base, line: { color: t.surf, width: 2 } }, hovertemplate: t_('persist') + '<br>%{x}: <b>%{y:.2f} µg/m³</b><extra></extra>' },
    { type: 'bar', name: t_('model_d1'), x: lab, y: m.map(r => r.MAE), marker: { color: t.s1, line: { color: t.surf, width: 2 } },
      text: m.map((r, i) => '−' + pct(1 - r.MAE / p[i].MAE)), textposition: 'outside', textfont: { color: t.text },
      hovertemplate: t_('model_d1') + '<br>%{x}: <b>%{y:.2f} µg/m³</b><extra></extra>' }
  ], L({ barmode: 'group', yaxis: { title: { text: 'MAE (µg/m³)' }, gridcolor: t.grid, automargin: true, rangemode: 'tozero' } }), cfg);
}

function alertChart() {
  const t = T(), est = D.bands.filter(r => r.tarefa === 'estimativa D'), rows = [
    [t_('a_idw'), est.find(r => r.metodo.startsWith('IDW')), t.base],
    [t_('a_point'), est.find(r => r.metodo.startsWith('LightGBM')), t.soft],

    customdata: rows.map(r => r[1]['precisao_>25']), hovertemplate: `%{x}<br>${t_('detects')} <b>%{y:.0%}</b> ${t_('of_polluted')}<br>${t_('precision')} %{customdata:.0%}<extra></extra>`
  }], L({ showlegend: false, yaxis: { tickformat: '.0%', range: [0, 1.08], gridcolor: t.grid, automargin: true, title: { text: t_('sens') } } }), cfg);
}

function shap() {
  const t = T(), s = [...D.shap].reverse();
  Plotly.react('shap', [{ type: 'bar', orientation: 'h', y: s.map(r => label(r.var)), x: s.map(r => r.valor), marker: { color: t.s1 },

    L({ showlegend: false, margin: { l: 10, r: 14, t: 6, b: 36 }, xaxis: { title: { text: t_('shap_axis') }, gridcolor: t.grid, automargin: true }, yaxis: { automargin: true, tickfont: { size: 11 } } }), cfg);

function ret() {
  const t = T(), keys = [['BM25', 'BM25'], ['Vetorial (granite-multilingual-278m)', t_('emb')], ['Híbrido RRF (BM25 + granite-multilingual-278m)', t_('hyb')],

  const r = keys.map(([k]) => D.retrieval.find(x => x.config === k)), x = keys.map(k => k[1]);

  Plotly.react('ret', [mk('recall@1', t.soft), mk('recall@5', t.s1)],

}

function rag() {
  const t = T(), m = [['acerto', 'm_acc'], ['cit_precisao', 'm_cit'], ['fidelidade_juiz', 'm_faith'], ['recusa_correta (sem resposta)', 'm_ref'], ['ferramenta_ok', 'm_tool']];
  const q = D.rag.find(r => r.modelo.startsWith('qwen3')), g = D.rag.find(r => r.modelo.startsWith('gemma3'));
  const mk = (row, name, color) => ({ type: 'bar', orientation: 'h', name, y: m.map(v => t_(v[1])), x: m.map(v => row[v[0]] || 0),
    marker: { color, line: { color: t.surf, width: 2 } }, hovertemplate: name + '<br>%{y}: <b>%{x:.0%}</b><extra></extra>' });
  Plotly.react('rag', [mk(g, 'Gemma3-4B', t.base), mk(q, 'Qwen3-4B ' + t_('chosen'), t.s1)],
    L({ barmode: 'group', margin: { l: 10, r: 14, t: 6, b: 40 }, xaxis: { tickformat: '.0%', range: [0, 1.05], gridcolor: t.grid }, yaxis: { automargin: true, autorange: 'reversed' } }), cfg);
}

function renderAll() {
  texts(); kpis(); map(); bench(); dist(); cov(); fc(); alertChart(); shap(); ret(); rag(); series(current || sel.value);
  if (window.agentTexts) agentTexts();
}
const sel = document.getElementById('station');
Object.keys(D.series).sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(n => sel.add(new Option(n, n)));
sel.value = D.stations[0].name;  // estação com maior PM2.5 médio
sel.addEventListener('change', () => series(sel.value));
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('airiq-lang', lang); } catch (e) {}
  renderAll();
}));
renderAll();
document.getElementById('map').on('plotly_click', e => { const pt = e.points.find(p => p.curveNumber === 1); if (!pt) return;
  sel.value = pt.text; series(pt.text); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll);
</script>

});
Object.assign(I18N.pt, {

  l5: 'Escolha uma pergunta (ou busque) e veja o agente planejar, buscar nas normas, chamar o modelo de PM2.5, escrever a resposta e validar cada número. São respostas reais do Qwen3-4B local, gravadas no log da avaliação.',
  ptnote: '🇧🇷 As normas são leis federais brasileiras, por isso perguntas, respostas e trechos de lei estão em <strong>português</strong>.',
  chat_title: 'Agente AirIQ · Qwen3-4B (local, CPU)', replay_badge: 'replay de execuções gravadas · acelerado', send: 'Enviar',
  search_ph: 'Buscar nas 36 perguntas…', ask_ph: 'Digite para buscar ou escolha uma pergunta ao lado', more: 'Ver as 36 perguntas', less: 'Ver perguntas em destaque',
  welcome: 'Olá! Respondo perguntas sobre normas brasileiras de qualidade do ar citando o artigo exato, e consulto o modelo de PM2.5 para uma cidade e data. Escolha uma pergunta para começar.',
  nomatch: 'Esta demonstração pública reproduz execuções gravadas do LLM local, então só responde às 36 perguntas da avaliação. Escolha uma da lista.',
  t_fato: 'fato', t_multi: 'vários trechos', t_temporal: 'vigência', t_ferramenta: 'usa o modelo de PM2.5', t_sem_resposta: 'fora da base',
  s_plan: 'Planejando a resposta', s_plan_d: 'buscas: ', s_search: 'Buscando em 7 normas brasileiras', s_search_d: '{n} trechos · BM25 + embeddings + reranker · melhor relevância {r}',
  s_tool: 'Chamando o modelo de PM2.5', s_std: 'Consultando o padrão vigente', s_refuse: 'Relevância abaixo do limiar: recusa em vez de chutar',
  s_write: 'Escrevendo a resposta', s_valid: 'Validação: todo número tem fonte', s_valid_bad: 'Validação: conteúdo sem fonte → recusada',
  m_ok: '✓ confere com o gabarito', m_bad: '✗ difere do gabarito', m_ref: '✓ recusa correta', m_time: 'execução original: {s} s em CPU',

});
const FEATURED = ['q31', 'q30', 'q28', 'q22', 'q11', 'q32', 'q18', 'q10'];
const RUNS = D.runs, byId = Object.fromEntries(RUNS.map(r => [r.id, r]));
let showAll = false, busy = false;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function qlist() {
  const q = norm($('qsearch').value.trim());
  let rows = q ? RUNS.filter(r => norm(r.question).includes(q) || norm(t_('t_' + r.type)).includes(q))
               : (showAll ? RUNS : FEATURED.map(id => byId[id]).filter(Boolean));
  $('qlist').innerHTML = rows.map(r => `<button type="button" class="qbtn" data-q="${r.id}"><small>${esc(t_('t_' + r.type))}</small>${esc(r.question)}</button>`).join('');
  $('qmore').textContent = showAll ? t_('less') : t_('more');
  $('qmore').hidden = !!q;
}

function agentTexts() {
  texts();
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = t_(el.dataset.ph));
  qlist();
  if (!$('msgs').children.length) bot(`<div>${esc(t_('welcome'))}</div>`);
}

function scroll() { const m = $('msgs'); m.scrollTop = m.scrollHeight; }
function bot(html) { const d = document.createElement('div'); d.className = 'bubble bot'; d.innerHTML = html; $('msgs').appendChild(d); scroll(); return d; }
function user(text) { const d = document.createElement('div'); d.className = 'bubble user'; d.textContent = text; $('msgs').appendChild(d); scroll(); }

async function step(ul, label, detail, ms) {
  const li = document.createElement('li');
  li.innerHTML = `<span class="ic"><span class="spin"></span></span><span>${esc(label)}${detail ? `<span class="detail">${esc(detail)}</span>` : ''}</span>`;
  ul.appendChild(li); scroll(); await sleep(ms);
  li.querySelector('.ic').textContent = '✓'; return li;
}

async function replay(run) {
  if (busy) return; busy = true; $('askbtn').disabled = true;
  user(run.question);
  const b = bot('<ul class="steps"></ul>'), ul = b.querySelector('.steps');
  const searches = [...new Set(run.tools.filter(t => t.name === 'buscar_normas').map(t => t.args.consulta))].filter(s => s !== run.question);
  await step(ul, t_('s_plan'), searches.length ? t_('s_plan_d') + searches.map(s => `“${s}”`).join(' · ') : '', 900);
  await step(ul, t_('s_search'), fill(t_('s_search_d'), { n: run.n_retrieved, r: (run.relevance ?? 0).toFixed(2) }), 1100);
  for (const tl of run.tools.filter(t => t.name !== 'buscar_normas')) {
    const r = tl.result || {}, a = tl.args || {};
    if (tl.name === 'estimar_pm25') {
      const det = r.pm25_ug_m3 != null ? `${a.local} · ${r.data_alvo} → ${r.pm25_ug_m3} µg/m³ (90%: ${r.intervalo_90.join('–')}) · IQAr: ${r.faixa_iqar}` : `${a.local} · ${a.data}`;
      await step(ul, t_('s_tool'), det, 1200);
    } else {
      await step(ul, t_('s_std'), a.data ? String(a.data) : '', 800);
    }
  }
  if (run.threshold_refusal) await step(ul, t_('s_refuse'), '', 700);
  const li = document.createElement('li'); li.innerHTML = `<span class="ic"><span class="spin"></span></span><span>${esc(t_('s_write'))}</span>`; ul.appendChild(li);
  const ans = document.createElement('div'); ans.className = 'answer caret'; b.appendChild(ans);
  const text = run.answer, chunk = Math.max(2, Math.round(text.length / 260));
  for (let i = 0; i < text.length; i += chunk) { ans.textContent = text.slice(0, i + chunk); if (i % (chunk * 6) === 0) scroll(); await sleep(16); }
  ans.classList.remove('caret'); li.querySelector('.ic').textContent = '✓';
  if (run.found) await step(ul, run.validation_ok ? t_('s_valid') : t_('s_valid_bad'), '', 500);
  const verdict = run.type === 'sem_resposta' ? (run.correct ? ['ok', t_('m_ref')] : ['bad', t_('m_bad')]) : (run.correct ? ['ok', t_('m_ok')] : ['bad', t_('m_bad')]);
  let extra = `<div class="meta"><span class="pill ${verdict[0]}">${esc(verdict[1])}</span><span class="pill">${esc(fill(t_('m_time'), { s: Math.round(run.seconds) }))}</span>` +
    `<span class="pill">${esc(fill(t_('m_tok'), { t: run.tokens.toLocaleString() }))}</span><span class="pill">${esc(t_('m_cost'))}</span></div>`;
  if (run.passages.length) extra += `<details><summary>${esc(fill(t_('passages'), { n: run.passages.length }))}</summary>` +
    run.passages.map(p => `<p><strong>[${p.n}] ${esc(p.citation)}</strong>\n${esc(p.text)}${p.text.length >= 700 ? '…' : ''}</p>`).join('') + '</details>';
  if (!run.correct && run.expected) extra += `<details><summary>${esc(t_('expected').replace(/: $/, ''))}</summary><p>${esc(run.expected)}</p></details>`;
  b.insertAdjacentHTML('beforeend', extra); scroll();
  busy = false; $('askbtn').disabled = false;
}

$('qlist').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) replay(byId[b.dataset.q]); });
$('qmore').addEventListener('click', () => { showAll = !showAll; qlist(); });
$('qsearch').addEventListener('input', qlist);
$('askinput').addEventListener('input', () => { $('qsearch').value = $('askinput').value; qlist(); });
$('askform').addEventListener('submit', e => {
  e.preventDefault(); if (busy) return;
  const q = norm($('askinput').value.trim()); if (!q) return;
  const hit = RUNS.find(r => norm(r.question) === q) || RUNS.find(r => norm(r.question).includes(q));
  $('askinput').value = ''; $('qsearch').value = ''; qlist();
  if (hit) replay(hit); else { user(q); bot(`<div>${esc(t_('nomatch'))}</div>`); }
});
agentTexts();
</script>
</body>
</html>
