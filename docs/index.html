<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirIQ SP Dashboard</title>
<meta name="description" content="Air quality in São Paulo, Brazil, with satellite data, machine learning and an AI agent that reads environmental regulations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.1.0/plotly.min.js"></script>
<script src="data.js"></script>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3ef; --surface-1: #fcfcfb; --border: #e3e1da;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7973;
  --grid: #ebe9e3;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --base: #9a988f; --soft: #b7d3f6;
  --accent-bg: #e8f1fc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #2e2d2a;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --grid: #2a2927;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --base: #77766f; --soft: #1c5cab;
    --accent-bg: #15263b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --border: #2e2d2a;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --grid: #2a2927;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --base: #77766f; --soft: #1c5cab;
  --accent-bg: #15263b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 32px 16px 64px; }
header h1 { font-size: clamp(28px, 4vw, 40px); margin: 0 0 6px; letter-spacing: -0.02em; }
header p { margin: 0; color: var(--text-secondary); max-width: 760px; }
header .links { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
a { color: var(--s1); }
.btn { display: inline-block; padding: 7px 14px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface-1); color: var(--text-primary); text-decoration: none; font-weight: 500; font-size: 14px; }
.btn:hover { border-color: var(--s1); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 28px 0 8px; }
.kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.kpi b { display: block; font-size: 26px; letter-spacing: -0.02em; }
.kpi span { color: var(--text-secondary); font-size: 13px; }
h2 { font-size: 21px; margin: 44px 0 4px; letter-spacing: -0.01em; }
.lead { color: var(--text-secondary); margin: 0 0 14px; max-width: 820px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 14px 6px; min-width: 0; }
.card h3 { font-size: 15px; margin: 0 0 2px; }
.card p { margin: 0 0 6px; color: var(--text-secondary); font-size: 13px; }
.chart { width: 100%; height: 380px; }
.chart.tall { height: 520px; }
.note { background: var(--accent-bg); border-radius: 10px; padding: 10px 14px; font-size: 14px; color: var(--text-primary); margin-top: 12px; }
select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); max-width: 100%; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; font-size: 13px; color: var(--text-secondary); }
footer { margin-top: 48px; color: var(--text-muted); font-size: 13px; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .chart.tall { height: 440px; } }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.lang { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
.lang button { font: inherit; font-size: 13px; padding: 5px 10px; border: 0; background: var(--surface-1); color: var(--text-secondary); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--s1); color: #fff; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--s1); margin-bottom: 6px; }
.agent { display: grid; grid-template-columns: 340px 1fr; gap: 16px; }
.qpanel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px; min-width: 0; }
.qpanel input { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-0); color: var(--text-primary); }
.qlist { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-height: 520px; overflow-y: auto; }
.qbtn { text-align: left; font: inherit; font-size: 13px; line-height: 1.4; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-0); color: var(--text-primary); cursor: pointer; }
.qbtn:hover, .qbtn:focus-visible { border-color: var(--s1); outline: none; }
.qbtn small { display: block; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
.linkbtn { font: inherit; font-size: 13px; background: none; border: 0; color: var(--s1); cursor: pointer; padding: 6px 0 0; }
.chat { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; min-height: 560px; max-height: 760px; min-width: 0; }
.chathead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-secondary); flex-wrap: wrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #1baf7a; margin-right: 6px; }
.replay { font-size: 11px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; color: var(--text-muted); }
.msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.bubble { max-width: 92%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble.user { align-self: flex-end; background: var(--s1); color: #fff; border-bottom-right-radius: 4px; }
.bubble.bot { align-self: flex-start; background: var(--surface-0); border: 1px solid var(--border); border-bottom-left-radius: 4px; white-space: normal; }
.steps { list-style: none; margin: 0 0 8px; padding: 0; font-size: 13px; color: var(--text-secondary); }
.steps li { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; }
.steps .ic { width: 16px; flex-shrink: 0; text-align: center; }
.steps .detail { color: var(--text-muted); font-size: 12px; display: block; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--s1); border-radius: 50%; animation: sp .8s linear infinite; margin-top: 3px; }
@keyframes sp { to { transform: rotate(360deg); } }
.answer { white-space: pre-wrap; color: var(--text-primary); border-top: 1px dashed var(--border); padding-top: 8px; }
.caret::after { content: "▍"; color: var(--s1); animation: bl 1s steps(1) infinite; }
@keyframes bl { 50% { opacity: 0; } }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: 12px; }
.pill { border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; color: var(--text-secondary); }
.pill.ok { border-color: #1baf7a; color: #13865e; }
.pill.bad { border-color: #e34948; color: #c23a39; }
.bubble details { margin-top: 8px; font-size: 13px; }
.bubble details p { margin: 6px 0; padding: 8px 10px; background: var(--surface-1); border-left: 3px solid var(--s1); border-radius: 4px; white-space: pre-wrap; color: var(--text-secondary); }
.inputrow { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
.inputrow input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-0); color: var(--text-primary); }
.inputrow button, .cta { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 8px; border: 0; background: var(--s1); color: #fff; cursor: pointer; text-decoration: none; display: inline-block; }
.inputrow button:disabled { opacity: .5; cursor: default; }
.ptnote { font-size: 13px; color: var(--text-secondary); background: var(--accent-bg); border-radius: 10px; padding: 8px 12px; margin: 0 0 12px; }
@media (max-width: 820px) { .agent { grid-template-columns: 1fr; } .qlist { max-height: 260px; } .chat { min-height: 480px; } }
.citybar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 12px; }
.citybar input, .citybar select { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); }
.citybar input { min-width: 220px; flex: 1 1 220px; max-width: 320px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 7px 12px; border: 0; background: var(--surface-1); color: var(--text-secondary); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--s1); color: #fff; }
.daynav { display: inline-flex; align-items: center; gap: 6px; }
.daynav button { font: inherit; font-size: 14px; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); cursor: pointer; }
.daynav input[type=range] { width: 160px; min-width: 0; padding: 0; border: 0; background: none; }
.daylabel { font-size: 13px; color: var(--text-secondary); min-width: 120px; }
.citycard .big { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.citycard .big small { font-size: 16px; font-weight: 500; color: var(--text-secondary); }
.band { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #111; margin: 6px 0; }
.facts { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; color: var(--text-secondary); }
.facts li { padding: 4px 0; border-top: 1px solid var(--border); }
.facts b { color: var(--text-primary); font-weight: 600; }
.caveat { font-size: 12px; color: var(--text-muted); margin-top: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: -1px; }
@media (max-width: 820px) { #cmap { height: 360px; } .citybar input { max-width: none; } .daynav input[type=range] { width: 110px; } }
.tt { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 4px; }
.tt > div { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.tt > div[aria-pressed="true"] { border-color: var(--s1); box-shadow: inset 0 0 0 1px var(--s1); }
.tt .lbl { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
.tt .v { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.tt .v small { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
.tt .rng { font-size: 12px; color: var(--text-secondary); }
.tt .chk { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.addbtn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--s1); background: none; color: var(--s1); cursor: pointer; margin-top: 8px; }
.addbtn:disabled { opacity: .5; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 4px 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-0); }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
.chip button { font: inherit; border: 0; background: none; color: var(--text-muted); cursor: pointer; padding: 0 6px; font-size: 15px; line-height: 1; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <div><span class="tag" data-i="tag"></span><h1>AirIQ SP</h1></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button>
    </div>
  </div>
  <p data-i="intro"></p>
  <div class="links">
    <a class="cta" href="#city" data-i="trycity"></a>
    <a class="cta" href="#agent" data-i="try"></a>
    <a class="btn" href="https://github.com/LucasBetioli123/AirIQ-SP" data-i="code"></a>
    <a class="btn" href="https://github.com/LucasBetioli123/AirIQ-SP/blob/main/docs/TECHNICAL_DETAILS.md" data-i="deep"></a>
  </div>
</header>

<section class="kpis" id="kpis"></section>

<h2 data-i="h1"></h2>
<p class="lead" data-i="l1"></p>
<div class="grid">
  <div class="card"><h3 data-i="c_map"></h3><p data-i="c_map_s"></p><div id="map" class="chart tall"></div></div>
  <div class="card"><h3 data-i="c_series"></h3>
    <div class="row"><label for="station" data-i="station"></label><select id="station"></select></div>
    <div id="series" class="chart tall"></div></div>
</div>

<h2 id="city" data-i="hc"></h2>
<p class="lead" data-i="lc"></p>
<div class="citybar">
  <input id="cityin" list="citylist" autocomplete="off" data-ph="city_ph" aria-label="City">
  <datalist id="citylist"></datalist>
  <select id="cwin" aria-label="Period"></select>
  <span class="daynav"><button type="button" id="cprev" aria-label="Previous day">‹</button><input type="range" id="cday" min="0" max="0" value="0" aria-label="Day"><button type="button" id="cnext" aria-label="Next day">›</button><button type="button" id="cplay" aria-label="Play">▶</button></span>
  <span class="seg" role="group"><button type="button" data-h="0" data-i="today"></button><button type="button" data-h="1" data-i="tomorrow"></button></span>
</div>
<div class="grid">
  <div class="card"><h3 id="cmaptitle"></h3><p data-i="cmap_s"></p><div id="cmap" class="chart tall"></div><div class="legend" id="clegend"></div></div>
  <div class="card citycard"><div id="ccard"></div><p class="caveat" data-i="caveat"></p></div>
</div>
<div class="grid" style="margin-top:16px">
  <div class="card"><h3 data-i="cmp_t"></h3><p id="cmp_s"></p><div class="chips" id="cchips"></div><div id="cchart" class="chart"></div></div>
  <div class="card"><h3 id="rank_t"></h3><p data-i="rank_s"></p><div id="crank" class="chart"></div></div>
</div>

<h2 data-i="h2"></h2>
<p class="lead" data-i="l2"></p>
<div class="grid">
  <div class="card"><h3 data-i="c_bench"></h3><p data-i="c_bench_s"></p><div id="bench" class="chart tall"></div></div>
  <div class="card"><h3 data-i="c_dist"></h3><p data-i="c_dist_s"></p><div id="dist" class="chart tall"></div></div>
</div>

<h2 data-i="h3"></h2>
<p class="lead" data-i="l3"></p>
<div class="grid">
  <div class="card"><h3 data-i="c_cov"></h3><p data-i="c_cov_s"></p><div id="cov" class="chart"></div></div>
  <div class="card"><h3 data-i="c_fc"></h3><p data-i="c_fc_s"></p><div id="fc" class="chart"></div></div>
</div>
<div class="grid" style="margin-top:16px">
  <div class="card"><h3 data-i="c_alert"></h3><p data-i="c_alert_s"></p><div id="alert" class="chart"></div></div>
  <div class="card"><h3 data-i="c_shap"></h3><p data-i="c_shap_s"></p><div id="shap" class="chart"></div></div>
</div>

<h2 data-i="h4"></h2>
<p class="lead" data-i="l4"></p>
<div class="grid">
  <div class="card"><h3 data-i="c_ret"></h3><p data-i="c_ret_s"></p><div id="ret" class="chart"></div></div>
  <div class="card"><h3 data-i="c_rag"></h3><p data-i="c_rag_s"></p><div id="rag" class="chart"></div></div>
</div>
<h2 id="agent" data-i="h5"></h2>
<p class="lead" data-i="l5"></p>
<p class="ptnote" data-i="ptnote"></p>
<div class="agent">
  <div class="qpanel">
    <input id="qsearch" type="search" data-ph="search_ph" aria-label="Search questions">
    <div class="qlist" id="qlist"></div>
    <button type="button" class="linkbtn" id="qmore"></button>
  </div>
  <div class="chat">
    <div class="chathead"><span><span class="dot"></span><span data-i="chat_title"></span></span><span class="replay" data-i="replay_badge"></span></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <form class="inputrow" id="askform">
      <input id="askinput" autocomplete="off" data-ph="ask_ph" aria-label="Question">
      <button id="askbtn" type="submit" data-i="send"></button>
    </form>
  </div>
</div>

<footer data-i="footer"></footer>
</div>

<script>
const I18N = {
  en: {
    tag: 'Air quality × AI',

// Rótulos que vêm dos CSVs (em português) e precisam de tradução no modo EN.
const LABELS_EN = [
  [/Krigagem ordinária/, 'Ordinary kriging'], [/Climatologia mensal/, 'Monthly climatology'], [/IDW \(baseline\)/, 'IDW (baseline)'],
  [/regularizado/, 'regularized'], [/reg\. forte/, 'strong reg.'], [/sem satélite/, 'no satellite'], [/sem lag espacial/, 'no spatial lag'],
  [/alvo bruto/, 'raw target'], [/saída tanh \[-0,7; 0,7\]/, 'tanh output [-0.7, 0.7]'],
  [/PM2\.5 das estações vizinhas \(IDW\)/, 'Neighbor-station PM2.5 (IDW)'], [/Área construída \(5 km\)/, 'Built-up area (5 km)'],
  [/Área construída \(célula\)/, 'Built-up area (cell)'], [/Cobertura arbórea \(5 km\)/, 'Tree cover (5 km)'], [/Chuva do dia anterior/, 'Previous-day rain'],
  [/Agricultura \(5 km\)/, 'Cropland (5 km)'], [/Altitude/, 'Elevation'], [/Sazonalidade \(dia do ano\)/, 'Seasonality (day of year)'],
  [/Pastagem \(5 km\)/, 'Grassland (5 km)'], [/Distância à estação mais próxima/, 'Distance to nearest station'],
  [/NO₂ troposférico \(Sentinel-5P\)/, 'Tropospheric NO₂ (Sentinel-5P)'], [/Camada limite mínima/, 'Minimum boundary layer'],
  [/NO₂ regional \(9×9\)/, 'Regional NO₂ (9×9)'], [/Temperatura a 2 m/, '2 m temperature']
];
let lang = 'en';
try { const q = new URLSearchParams(location.search).get('lang'); lang = q || localStorage.getItem('airiq-lang') || (navigator.language || '').startsWith('pt') && 'pt' || 'en'; } catch (e) {}
if (!I18N[lang]) lang = 'en';
const t_ = k => I18N[lang][k];
const label = s => lang === 'pt' ? s : LABELS_EN.reduce((acc, [re, en]) => acc.replace(re, en), s);

const D = window.DATA;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const T = () => ({ s1: css('--s1'), s2: css('--s2'), s3: css('--s3'), base: css('--base'), soft: css('--soft'),
  text: css('--text-primary'), text2: css('--text-secondary'), grid: css('--grid'), surf: css('--surface-1') });
const fmt = (v, d = 2) => Number(v).toLocaleString(lang === 'pt' ? 'pt-BR' : 'en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = v => fmt(100 * v, 0) + '%';
const cfg = { displaylogo: false, responsive: true, modeBarButtonsToRemove: ['lasso2d', 'select2d', 'autoScale2d'] };
function L(extra = {}) {
  const t = T();
  return Object.assign({
    paper_bgcolor: t.surf, plot_bgcolor: t.surf, font: { family: 'Inter, system-ui, sans-serif', color: t.text2, size: 12 },
    separators: lang === 'pt' ? ',.' : '.,',
    margin: { l: 10, r: 14, t: 10, b: 40 }, hoverlabel: { font: { family: 'Inter, system-ui, sans-serif' } },
    xaxis: { gridcolor: t.grid, zeroline: false, automargin: true, linecolor: t.grid },
    yaxis: { gridcolor: t.grid, zeroline: false, automargin: true, linecolor: t.grid },
    legend: { orientation: 'h', y: -0.18, x: 0 }, bargap: 0.25, barcornerradius: 4
  }, extra);
}

function texts() {
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = t_(el.dataset.i); });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}

function kpis() {
  const best = D.benchmark.find(r => r.modelo.startsWith('LightGBM regularizado (offset'));
  const far = D.distance.filter(r => r.grupo === '25-50 km');
  const fi = far.find(r => r.modelo.startsWith('IDW')).MAE, fm = far.find(r => r.modelo.startsWith('LightGBM')).MAE;
  const cqr = D.intervals.find(r => r.recorte === 'todos' && r.metodo.startsWith('CQR'));
  const q = D.rag.find(r => r.modelo.startsWith('qwen3'));
  const items = [
    [fmt(best.MAE) + ' µg/m³', t_('k_mae')], ['−' + pct(1 - fm / fi), t_('k_far')], [pct(cqr.cobertura_real), t_('k_cov')],
    [pct(q.acerto), t_('k_acc')], [pct(q['recusa_correta (sem resposta)']), t_('k_ref')], [t_('k_cost_v'), t_('k_cost')],
  ];
  document.getElementById('kpis').innerHTML = items.map(([b, s]) => `<div class="kpi"><b>${b}</b><span>${s}</span></div>`).join('');
}

let current = null;
function map() {
  const t = T(), s = D.stations, o = D.outline;
  Plotly.react('map', [
    { type: 'scatter', mode: 'lines', x: o.lon, y: o.lat, fill: 'toself', fillcolor: css('--accent-bg'), line: { color: t.text2, width: 1 }, hoverinfo: 'skip', showlegend: false },
    { type: 'scatter', mode: 'markers', y: s.map(r => r.lat), x: s.map(r => r.lon), text: s.map(r => r.name),
      customdata: s.map(r => [r.media, r.maximo, r.acima25 * 100, r.dias]), showlegend: false,
      marker: { size: s.map(r => 9 + 60 * r.acima25), color: s.map(r => r.media), line: { color: t.surf, width: 1.5 },
        colorscale: [[0, '#cde2fb'], [0.5, '#3987e5'], [1, '#0d366b']], cmin: 8, cmax: 19,
        colorbar: { title: { text: 'µg/m³', side: 'top' }, thickness: 10, len: 0.55, x: 1, tickfont: { color: t.text2 }, outlinewidth: 0 } },
      hovertemplate: `<b>%{text}</b><br>${t_('mean')}: %{customdata[0]:.1f} µg/m³<br>${t_('max')}: %{customdata[1]:.1f}<br>${t_('above')}: %{customdata[2]:.0f}%<br>${t_('days')}: %{customdata[3]}<extra></extra>` }
  ], L({ margin: { l: 0, r: 0, t: 0, b: 0 }, dragmode: 'pan', hovermode: 'closest',
    xaxis: { visible: false, range: [-53.3, -44] },
    yaxis: { visible: false, range: [-25.5, -19.6], scaleanchor: 'x', scaleratio: 1 / Math.cos(22.5 * Math.PI / 180) } }), cfg);
}

function series(name) {
  current = name;
  const t = T(), s = D.series[name];
  Plotly.react('series', [{
    type: 'scatter', mode: 'lines', x: s.x, y: s.y, name: name, line: { color: t.s1, width: 1.6 }, connectgaps: false,
    hovertemplate: '%{x|%Y-%m-%d}<br><b>%{y:.1f} µg/m³</b><extra></extra>'
  }], L({
    showlegend: false, hovermode: 'x unified', margin: { l: 10, r: 14, t: 10, b: 30 },
    yaxis: { title: { text: 'PM2.5 (µg/m³)' }, gridcolor: t.grid, zeroline: false, automargin: true, rangemode: 'tozero' },
    xaxis: { gridcolor: t.grid, automargin: true, rangeslider: { visible: true, thickness: 0.08, bgcolor: t.surf } },
    shapes: [{ type: 'line', xref: 'paper', x0: 0, x1: 1, y0: 25, y1: 25, line: { color: t.s2, width: 1.5, dash: 'dot' } }],
    annotations: [{ xref: 'paper', x: 1, y: 25, text: t_('limit'), showarrow: false, xanchor: 'right', yanchor: 'bottom', font: { color: t.text2, size: 11 } }]
  }), cfg);
}

function bench() {
  const t = T(), b = [...D.benchmark].sort((a, c) => c.MAE - a.MAE);
  const color = r => r.modelo.startsWith('LightGBM regularizado (offset') ? t.s1 :
    /IDW \(baseline\)|Krigagem|Climatologia/.test(r.modelo) ? t.base : t.soft;
  Plotly.react('bench', [{
    type: 'bar', orientation: 'h', y: b.map(r => label(r.modelo)), x: b.map(r => r.MAE), marker: { color: b.map(color) },
    error_x: { type: 'data', array: b.map(r => r.MAE_std_folds), color: t.text2, thickness: 1, width: 0 },
    customdata: b.map(r => r.R2), hovertemplate: '<b>%{y}</b><br>MAE %{x:.2f} µg/m³<br>R² %{customdata:.3f}<extra></extra>'
  }], L({ showlegend: false, margin: { l: 10, r: 14, t: 6, b: 36 }, xaxis: { title: { text: t_('mae_axis') }, gridcolor: t.grid, automargin: true }, yaxis: { automargin: true, tickfont: { size: 11 } } }), cfg);
}

function dist() {
  const t = T(), order = ['<10 km', '10-25 km', '25-50 km', '>50 km'];
  const mk = (prefix, name, color) => {
    const rows = order.map(g => D.distance.find(r => r.grupo === g && r.modelo.startsWith(prefix)));
    return { type: 'bar', name, x: order, y: rows.map(r => r.MAE), marker: { color, line: { color: t.surf, width: 2 } },
      customdata: rows.map(r => r.n), hovertemplate: name + '<br>%{x}: <b>%{y:.2f} µg/m³</b> (n=%{customdata})<extra></extra>' };
  };
  Plotly.react('dist', [mk('IDW', t_('idw'), t.base), mk('Krigagem', t_('krig'), t.s2), mk('LightGBM', t_('lgbm'), t.s1)],
    L({ barmode: 'group', yaxis: { title: { text: 'MAE (µg/m³)' }, gridcolor: t.grid, automargin: true, rangemode: 'tozero' },
      xaxis: { title: { text: t_('dist_axis') }, automargin: true },
      annotations: [{ x: '>50 km', y: 4.9, text: t_('one_st'), showarrow: false, font: { size: 11, color: t.text2 } }] }), cfg);
}

function cov() {
  const t = T(), c = D.coverage;
  Plotly.react('cov', [{
    type: 'bar', x: c.map(r => r.faixa + ' µg/m³'), y: c.map(r => r.cobertura_cqr), marker: { color: t.s1 }, customdata: c.map(r => [r.n, r.largura_cqr]),
    hovertemplate: `%{x}<br>${t_('coverage')} <b>%{y:.1%}</b><br>${t_('width')} %{customdata[1]:.1f} µg/m³<br>n=%{customdata[0]:.0f}<extra></extra>`
  }], L({ showlegend: false, yaxis: { tickformat: '.0%', range: [0.5, 1], gridcolor: t.grid, automargin: true }, xaxis: { title: { text: t_('band_axis') } },
    shapes: [{ type: 'line', xref: 'paper', x0: 0, x1: 1, y0: 0.9, y1: 0.9, line: { color: t.s2, width: 1.5, dash: 'dot' } }],
    annotations: [{ xref: 'paper', x: 1, y: 0.9, text: t_('nominal'), showarrow: false, xanchor: 'right', yanchor: 'bottom', font: { size: 11, color: t.text2 } }] }), cfg);
}

function fc() {
  const t = T(), sc = ['A) local com estação', 'B) local sem estação'], lab = [t_('with_st'), t_('without_st')];
  const pick = re => sc.map(s => D.forecast.find(r => r.cenario === s && re.test(r.metodo)));
  const p = pick(/Persist/), m = pick(/LightGBM/);
  Plotly.react('fc', [
    { type: 'bar', name: t_('persist'), x: lab, y: p.map(r => r.MAE), marker: { color: t.base, line: { color: t.surf, width: 2 } }, hovertemplate: t_('persist') + '<br>%{x}: <b>%{y:.2f} µg/m³</b><extra></extra>' },
    { type: 'bar', name: t_('model_d1'), x: lab, y: m.map(r => r.MAE), marker: { color: t.s1, line: { color: t.surf, width: 2 } },
      text: m.map((r, i) => '−' + pct(1 - r.MAE / p[i].MAE)), textposition: 'outside', textfont: { color: t.text },
      hovertemplate: t_('model_d1') + '<br>%{x}: <b>%{y:.2f} µg/m³</b><extra></extra>' }
  ], L({ barmode: 'group', yaxis: { title: { text: 'MAE (µg/m³)' }, gridcolor: t.grid, automargin: true, rangemode: 'tozero' } }), cfg);
}

function alertChart() {
  const t = T(), est = D.bands.filter(r => r.tarefa === 'estimativa D'), rows = [
    [t_('a_idw'), est.find(r => r.metodo.startsWith('IDW')), t.base],
    [t_('a_point'), est.find(r => r.metodo.startsWith('LightGBM')), t.soft],
    [t_('a_alert'), est.find(r => r.metodo.startsWith('Alerta')), t.s1]];
  Plotly.react('alert', [{
    type: 'bar', x: rows.map(r => r[0]), y: rows.map(r => r[1]['sensibilidade_>25']), marker: { color: rows.map(r => r[2]) },
    text: rows.map(r => pct(r[1]['sensibilidade_>25'])), textposition: 'outside', textfont: { color: t.text },
    customdata: rows.map(r => r[1]['precisao_>25']), hovertemplate: `%{x}<br>${t_('detects')} <b>%{y:.0%}</b> ${t_('of_polluted')}<br>${t_('precision')} %{customdata:.0%}<extra></extra>`
  }], L({ showlegend: false, yaxis: { tickformat: '.0%', range: [0, 1.08], gridcolor: t.grid, automargin: true, title: { text: t_('sens') } } }), cfg);
}

function shap() {
  const t = T(), s = [...D.shap].reverse();
  Plotly.react('shap', [{ type: 'bar', orientation: 'h', y: s.map(r => label(r.var)), x: s.map(r => r.valor), marker: { color: t.s1 },
    hovertemplate: '%{y}<br>|SHAP| %{x:.4f}<extra></extra>' }],
    L({ showlegend: false, margin: { l: 10, r: 14, t: 6, b: 36 }, xaxis: { title: { text: t_('shap_axis') }, gridcolor: t.grid, automargin: true }, yaxis: { automargin: true, tickfont: { size: 11 } } }), cfg);
}

function ret() {
  const t = T(), keys = [['BM25', 'BM25'], ['Vetorial (granite-multilingual-278m)', t_('emb')], ['Híbrido RRF (BM25 + granite-multilingual-278m)', t_('hyb')],
    ['Híbrido + reranker Qwen3-0.6B (top 8, granite-multilingual-278m)', t_('hybr')]];
  const r = keys.map(([k]) => D.retrieval.find(x => x.config === k)), x = keys.map(k => k[1]);
  const mk = (key, color) => ({ type: 'bar', name: key, x, y: r.map(v => v[key]), marker: { color, line: { color: t.surf, width: 2 } }, hovertemplate: key + '<br>%{x}: <b>%{y:.0%}</b><extra></extra>' });
  Plotly.react('ret', [mk('recall@1', t.soft), mk('recall@5', t.s1)],
    L({ barmode: 'group', yaxis: { tickformat: '.0%', range: [0, 1.05], gridcolor: t.grid, automargin: true } }), cfg);
}

function rag() {
  const t = T(), m = [['acerto', 'm_acc'], ['cit_precisao', 'm_cit'], ['fidelidade_juiz', 'm_faith'], ['recusa_correta (sem resposta)', 'm_ref'], ['ferramenta_ok', 'm_tool']];
  const q = D.rag.find(r => r.modelo.startsWith('qwen3')), g = D.rag.find(r => r.modelo.startsWith('gemma3'));
  const mk = (row, name, color) => ({ type: 'bar', orientation: 'h', name, y: m.map(v => t_(v[1])), x: m.map(v => row[v[0]] || 0),
    marker: { color, line: { color: t.surf, width: 2 } }, hovertemplate: name + '<br>%{y}: <b>%{x:.0%}</b><extra></extra>' });
  Plotly.react('rag', [mk(g, 'Gemma3-4B', t.base), mk(q, 'Qwen3-4B ' + t_('chosen'), t.s1)],
    L({ barmode: 'group', margin: { l: 10, r: 14, t: 6, b: 40 }, xaxis: { tickformat: '.0%', range: [0, 1.05], gridcolor: t.grid }, yaxis: { automargin: true, autorange: 'reversed' } }), cfg);
}

function renderAll() {
  texts(); kpis(); map(); bench(); dist(); cov(); fc(); alertChart(); shap(); ret(); rag(); series(current || sel.value);
  if (window.agentTexts) agentTexts();
  if (window.cityTexts) cityTexts();
}
const sel = document.getElementById('station');
Object.keys(D.series).sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(n => sel.add(new Option(n, n)));
sel.value = D.stations[0].name;  // estação com maior PM2.5 médio
sel.addEventListener('change', () => series(sel.value));
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('airiq-lang', lang); } catch (e) {}
  renderAll();
}));
renderAll();
document.getElementById('map').on('plotly_click', e => { const pt = e.points.find(p => p.curveNumber === 1); if (!pt) return;
  sel.value = pt.text; series(pt.text); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll);
</script>

async function step(ul, label, detail, ms) {

async function replay(run) {
  if (busy) return; busy = true; $('askbtn').disabled = true;

  const b = bot('<ul class="steps"></ul>'), ul = b.querySelector('.steps');
  const searches = [...new Set(run.tools.filter(t => t.name === 'buscar_normas').map(t => t.args.consulta))].filter(s => s !== run.question);
  await step(ul, t_('s_plan'), searches.length ? t_('s_plan_d') + searches.map(s => `“${s}”`).join(' · ') : '', 900);
  await step(ul, t_('s_search'), fill(t_('s_search_d'), { n: run.n_retrieved, r: (run.relevance ?? 0).toFixed(2) }), 1100);
  for (const tl of run.tools.filter(t => t.name !== 'buscar_normas')) {
    const r = tl.result || {}, a = tl.args || {};
    if (tl.name === 'estimar_pm25') {
      const det = r.pm25_ug_m3 != null ? `${a.local} · ${r.data_alvo} → ${r.pm25_ug_m3} µg/m³ (90%: ${r.intervalo_90.join('–')}) · IQAr: ${r.faixa_iqar}` : `${a.local} · ${a.data}`;

    } else {

  const ans = document.createElement('div'); ans.className = 'answer caret'; b.appendChild(ans);
  const text = run.answer, chunk = Math.max(2, Math.round(text.length / 260));
  for (let i = 0; i < text.length; i += chunk) { ans.textContent = text.slice(0, i + chunk); if (i % (chunk * 6) === 0) scroll(); await sleep(16); }
  ans.classList.remove('caret'); li.querySelector('.ic').textContent = '✓';
  if (run.found) await step(ul, run.validation_ok ? t_('s_valid') : t_('s_valid_bad'), '', 500);
  const verdict = run.type === 'sem_resposta' ? (run.correct ? ['ok', t_('m_ref')] : ['bad', t_('m_bad')]) : (run.correct ? ['ok', t_('m_ok')] : ['bad', t_('m_bad')]);
  let extra = `<div class="meta"><span class="pill ${verdict[0]}">${esc(verdict[1])}</span><span class="pill">${esc(fill(t_('m_time'), { s: Math.round(run.seconds) }))}</span>` +
    `<span class="pill">${esc(fill(t_('m_tok'), { t: run.tokens.toLocaleString() }))}</span><span class="pill">${esc(t_('m_cost'))}</span></div>`;
  if (run.passages.length) extra += `<details><summary>${esc(fill(t_('passages'), { n: run.passages.length }))}</summary>` +
    run.passages.map(p => `<p><strong>[${p.n}] ${esc(p.citation)}</strong>\n${esc(p.text)}${p.text.length >= 700 ? '…' : ''}</p>`).join('') + '</details>';
  if (!run.correct && run.expected) extra += `<details><summary>${esc(t_('expected').replace(/: $/, ''))}</summary><p>${esc(run.expected)}</p></details>`;
  b.insertAdjacentHTML('beforeend', extra); scroll();
  busy = false; $('askbtn').disabled = false;
}

$('qlist').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) replay(byId[b.dataset.q]); });

});

  $('ccard').innerHTML = `<h3>${esc(c.name)}</h3><div class="tt">` +
    box(0, c.pm[i], c.lo[i], c.hi[i], fill(t_('lbl_today'), { d: fmtDate(d) }), dd.obs[sn]) +
    box(1, c.fpm[i], c.flo[i], c.fhi[i], fill(t_('lbl_tom'), { d: fmtDate(addDay(d)) }), dd.obs_next[sn]) + '</div>' +
    `<ul class="facts"><li>${t_(lo > 25 ? 'above_pf' : hi < 25 ? 'below_pf' : 'cross_pf')}</li>` +
    `<li>${fill(t_('nearest'), { k: Math.round(c.dist_km) })}${c.dist_km > 50 ? esc(t_('far')) : ''}</li>` +
    `<li>${t_('std')}</li><li>${fill(t_('typical'), { e: est.toFixed(1), f: fcm.toFixed(1) })}</li></ul>` +
    `<button type="button" class="addbtn" id="cadd" ${inCmp || CM.cmp.length >= 4 ? 'disabled' : ''}>${esc(t_(inCmp ? 'added' : 'add'))}</button>`;
  document.querySelectorAll('[data-box]').forEach(el => { const go = () => setMode(+el.dataset.box); el.onclick = go; el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }; });
  $('cadd').onclick = () => { if (!CM.cmp.includes(c.name) && CM.cmp.length < 4) { CM.cmp.push(c.name); cityRender(); } };
}

function cityCompare(i) {
  const t = T(), m = CM.meta, fc = CM.h === 1, ds = winDates(), idx = ds.map(x => m.dates.indexOf(x)), xs = fc ? ds.map(addDay) : ds, cur = fc ? addDay(curDate()) : curDate();
  const names = CM.cmp.includes(CM.city.name) ? CM.cmp : [CM.city.name, ...CM.cmp].slice(0, 4), cols = CMPC();
  $('cmp_s').textContent = t_(fc ? 'cmp_s_fc' : 'cmp_s_est');
  $('cchips').innerHTML = names.map((n, k) => `<span class="chip" style="--c:${cols[k]}"><i></i>${esc(n)}${CM.cmp.includes(n) ? `<button type="button" data-rm="${esc(n)}" aria-label="Remove">×</button>` : ''}</span>`).join('');
  $('cchips').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { CM.cmp = CM.cmp.filter(x => x !== b.dataset.rm); cityRender(); });
  const sel = CM.city, P = fc ? 'fpm' : 'pm', LO = fc ? 'flo' : 'lo', HI = fc ? 'fhi' : 'hi';
  const traces = [
    { type: 'scatter', mode: 'lines', x: xs, y: idx.map(k => sel[HI][k]), line: { width: 0 }, hoverinfo: 'skip', showlegend: false },
    { type: 'scatter', mode: 'lines', x: xs, y: idx.map(k => sel[LO][k]), fill: 'tonexty', fillcolor: 'rgba(42,120,214,0.15)', line: { width: 0 }, hoverinfo: 'skip', showlegend: false }];
  names.forEach((n, k) => { const c = m.cities.find(x => x.name === n);
    traces.push({ type: 'scatter', mode: 'lines+markers', name: n, x: xs, y: idx.map(j => c[P][j]), line: { color: cols[k], width: n === sel.name ? 2.5 : 1.8 },
      marker: { size: xs.map(x => x === cur ? 10 : 4), color: cols[k] }, customdata: idx.map(j => [c[LO][j], c[HI][j]]),
      hovertemplate: `${esc(n)}: <b>%{y:.0f}</b> µg/m³ (%{customdata[0]:.0f}–%{customdata[1]:.0f})<extra></extra>` }); });
  Plotly.react('cchart', traces, L({ margin: { l: 10, r: 10, t: 6, b: 30 }, hovermode: 'x unified', showlegend: names.length > 1,
    yaxis: { title: { text: 'µg/m³' }, gridcolor: t.grid, rangemode: 'tozero', automargin: true },
    xaxis: { gridcolor: t.grid, automargin: true, tickformat: '%d/%m' },
    shapes: [{ type: 'line', xref: 'paper', x0: 0, x1: 1, y0: 25, y1: 25, line: { color: t.text2, width: 1, dash: 'dot' } }],
    annotations: [{ xref: 'paper', x: 1, y: 25, text: 'PF 25', showarrow: false, xanchor: 'right', yanchor: 'bottom', font: { size: 10, color: t.text2 } }] }), cfg);
}

function cityRank(i, fc, target) {
  const t = T(), m = CM.meta, key = fc ? 'fpm' : 'pm', lo = fc ? 'flo' : 'lo', hi = fc ? 'fhi' : 'hi';
  const top = [...m.cities].sort((a, b) => b[key][i] - a[key][i]).slice(0, 10).reverse();
  $('rank_t').textContent = fill(t_('rank_t'), { d: fmtDate(target) });
  Plotly.react('crank', [{ type: 'bar', orientation: 'h', y: top.map(c => c.name), x: top.map(c => c[key][i]),
    marker: { color: top.map(c => c.name === CM.city.name ? t.s1 : bandOf(c[key][i])[2]) },
    error_x: { type: 'data', symmetric: false, array: top.map(c => c[hi][i] - c[key][i]), arrayminus: top.map(c => c[key][i] - c[lo][i]), color: t.text2, thickness: 1, width: 0 },
    customdata: top.map(c => [c[lo][i], c[hi][i], Math.round(c.dist_km)]),
    hovertemplate: '<b>%{y}</b><br>%{x:.0f} µg/m³ (90%: %{customdata[0]:.0f}–%{customdata[1]:.0f})<br>%{customdata[2]} km → CETESB<extra></extra>' }],
    L({ showlegend: false, margin: { l: 10, r: 14, t: 6, b: 36 }, xaxis: { title: { text: 'PM2.5 (µg/m³) · whisker = 90%' }, gridcolor: t.grid, rangemode: 'tozero' }, yaxis: { automargin: true, tickfont: { size: 11 } } }), cfg);
  if (!CM.rankBound) { CM.rankBound = true; $('crank').on('plotly_click', e => { const p = e.points[0]; if (p) pickCity(p.y); }); }
}

function bindCityClick() {
  if (CM.bound) return; CM.bound = true;
  $('cmap').on('plotly_click', e => {
    const p = e.points[0]; if (!p) return;
    if (p.curveNumber === 2) return pickCity(p.text);
    pickCity(CM.meta.cities[nearestCity(p.x, p.y)].name);
  });
}
function pickCity(name) {
  const c = CM.meta.cities.find(x => cnorm(x.name) === cnorm(name)); if (!c) return false;
  CM.city = c; $('cityin').value = c.name; cityRender(); return true;
}
function stopPlay() { clearInterval(CM.timer); CM.timer = null; $('cplay').textContent = '▶'; }

(async () => {
  CM.meta = await (await fetch('maps/cities.json')).json();
  const m = CM.meta, nx = m.lons.length;
  CM.near = m.inside.map(k => nearestCity(m.lons[k % nx], m.lats[Math.floor(k / nx)]));
  m.cities.forEach(c => { let best = null, bd = 1e9; m.stations.forEach(s => { const d = ((s.lon - c.lon) * KX) ** 2 + (s.lat - c.lat) ** 2; if (d < bd) { bd = d; best = s.name; } }); CM.stNear[c.name] = best; });
  $('citylist').innerHTML = m.cities.map(c => `<option value="${esc(c.name)}">`).join('');
  CM.city = m.cities.find(c => c.name === 'Presidente Prudente') || m.cities[0];
  CM.cmp = ['Sorocaba', 'Ribeirão Preto', 'São Paulo'].filter(n => m.cities.some(c => c.name === n));
  $('cityin').value = CM.city.name;
  CM.day = Math.max(0, winDates().indexOf('2021-08-24'));
  $('cityin').addEventListener('change', e => pickCity(e.target.value));
  $('cityin').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!pickCity(e.target.value)) {
    const hit = m.cities.filter(c => cnorm(c.name).startsWith(cnorm(e.target.value))).sort((a, b) => a.name.length - b.name.length)[0]; if (hit) pickCity(hit.name); } } });
  $('cwin').addEventListener('change', e => { stopPlay(); CM.win = +e.target.value; CM.day = 0; cityRender(); });
  $('cday').addEventListener('input', e => { stopPlay(); CM.day = +e.target.value; cityRender(); });
  $('cprev').addEventListener('click', () => { stopPlay(); CM.day = Math.max(0, CM.day - 1); cityRender(); });
  $('cnext').addEventListener('click', () => { stopPlay(); CM.day = Math.min(winDates().length - 1, CM.day + 1); cityRender(); });
  $('cplay').addEventListener('click', () => {
    if (CM.timer) return stopPlay();
    $('cplay').textContent = '❚❚';
    if (CM.day >= winDates().length - 1) CM.day = 0;
    cityRender();
    CM.timer = setInterval(() => { if (CM.day >= winDates().length - 1) return stopPlay(); CM.day++; cityRender(); }, 1200);
  });
  document.querySelectorAll('[data-h]').forEach(b => b.addEventListener('click', () => setMode(+b.dataset.h)));
  texts(); agentTexts(); cityTexts();
})();
</script>
</body>
</html>
