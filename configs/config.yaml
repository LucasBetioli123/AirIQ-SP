# Configuração única do projeto. Todos os scripts leem daqui.
seed: 42

region:
  name: "Estado de São Paulo"
  # bbox do estado de SP (lon_min, lat_min, lon_max, lat_max)
  bbox: [-53.2, -25.4, -44.1, -19.7]
  # bbox ampliada para focos de queimada (transporte de fumaça de MS, MT, GO, MG, PR)
  fire_bbox: [-60.0, -30.0, -40.0, -14.0]
  grid_res_deg: 0.05
  tz: "America/Sao_Paulo"

period:
  # janela limitada pela disponibilidade do espelho CETESB no arquivo OpenAQ (ver RELATORIO.md)
  start: "2021-01-01"
  end: "2023-04-30"

split:
  # validação espaço-temporal: estação nunca vista (GroupKFold) + período posterior.
  # Origem móvel com 2 cortes, sempre testando DEPOIS do treino. T1 testa a estação seca de
  # 2021 (episódios de fumaça); T2 testa jul/2022-abr/2023. O arquivo OpenAQ tem poucos dias
  # em jul-set/2022, por isso um corte só deixaria o teste quase todo na estação chuvosa.
  temporal_folds:
    - {name: T1, train_end: "2021-05-31", calib_start: "2021-06-01", calib_end: "2021-06-30",
       test_start: "2021-07-01", test_end: "2021-12-31"}
    - {name: T2, train_end: "2022-03-31", calib_start: "2022-04-01", calib_end: "2022-06-30",
       test_start: "2022-07-01", test_end: "2023-04-30"}
  # modelos finais (mapa/API/agente): treinados até aqui
  train_end: "2022-03-31"
  calib_start: "2022-04-01"
  calib_end: "2022-06-30"
  test_start: "2022-07-01"
  n_station_folds: 5
  interval_alpha: 0.10   # intervalo de 90%

sample:
  # amostra versionada em data/sample: bases de treino completas (com variáveis) +
  # cubos de satélite/meteorologia só nestas janelas (para mapas, CLI, API e agente)
  context_windows:
    - ["2021-08-20", "2021-08-28"]   # episódio de fumaça (estação seca 2021)
    - ["2022-09-05", "2022-09-12"]
    - ["2022-10-09", "2022-10-12"]
    - ["2022-11-14", "2022-11-17"]
    - ["2023-03-28", "2023-04-04"]   # fim dos dados (data de referência do agente)

openaq:
  bucket_url: "https://openaq-data-archive.s3.amazonaws.com/"
  # location IDs da rede CETESB no arquivo OpenAQ (descobertos varrendo o bucket, ver src/aq/data/openaq.py --discover)
  candidate_location_ids: [5012, 5220, 5222, 5231, 5233, 5239, 5243, 5252, 5254, 5255, 5256, 5257, 5258,
    5259, 5260, 5261, 5262, 5263, 5264, 5265, 5266, 5267, 5268, 5269, 5270, 5271, 5272, 5273, 5274, 5275,
    5276, 5277, 5278, 5279, 5280, 5281, 5282, 5283, 5284, 5285, 5286, 5287, 5288, 5289, 5290, 5291, 5292,
    5293, 5294, 5295, 5296, 5297, 5298, 5299, 5300, 5301, 5302, 5303, 5304, 5305, 233408, 233409, 233410]
  min_valid_hours: 18     # média de 24 h só com >= 18 h válidas (75%)
  max_valid_value: 500.0  # µg/m³, descarta valores fisicamente implausíveis

goes:
  bucket_url: "https://noaa-goes16.s3.amazonaws.com/"
  aod_product: "ABI-L2-AODF"
  fire_product: "ABI-L2-FDCF"
  # uma varredura por hora no período diurno local (09h-16h BRT = 12-19 UTC)
  aod_hours_utc: [12, 13, 14, 15, 16, 17, 18, 19]
  fire_hours_utc: [0, 3, 6, 9, 12, 15, 18, 21]
  aod_dqf_max: 1          # 0 = alta, 1 = média qualidade

era5:
  bucket_url: "https://nsf-ncar-era5.s3.amazonaws.com/"
  # variáveis de superfície (análise): nome curto -> código do arquivo NCAR
  an_vars:
    blh: "128_159_blh"
    t2m: "128_167_2t"
    d2m: "128_168_2d"
    u10: "128_165_10u"
    v10: "128_166_10v"
    sp: "128_134_sp"
    tcc: "128_164_tcc"
  # precipitação total (acumulada da previsão)
  tp_var: "128_228_tp"

static:
  worldcover_url: "https://esa-worldcover.s3.amazonaws.com/v200/2021/map/"
  dem_url: "https://copernicus-dem-30m.s3.amazonaws.com/"

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  sample: "data/sample"
  models: "models"
  figures: "reports/figures"
  metrics: "reports/metrics"
  logs: "logs"

aqi:
  # Faixas do IQAr para MP2,5 (média de 24 h, µg/m³) - Guia técnico MMA/CETESB
  pm25_bands:
    - [0, 25, "Boa"]
    - [25, 50, "Moderada"]
    - [50, 75, "Ruim"]
    - [75, 125, "Muito Ruim"]
    - [125, 10000, "Péssima"]
