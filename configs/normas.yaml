# Base de conhecimento do agente (módulo RAG). Só documentos públicos, de fontes oficiais.
# vigencia_inicio/vigencia_fim permitem responder "qual regra valia na data X".
# urls: tentadas em ordem; o conteúdo baixado é validado por `must_contain`.
# Também é possível colocar o arquivo manualmente em data/raw/normas/<id>.<html|pdf>.
documentos:
  - id: conama_491_2018
    titulo: "Resolução CONAMA nº 491, de 19 de novembro de 2018"
    sigla: "Resolução CONAMA 491/2018"
    ementa: "Dispõe sobre padrões de qualidade do ar."
    tipo: resolucao
    data_publicacao: "2018-11-21"
    vigencia_inicio: "2018-11-21"
    vigencia_fim: null
    must_contain: ["491", "qualidade do ar"]
    # Revogação PARCIAL pela 506/2024 (art. 11, I): arts. 9º-11 e Anexos II-IV continuam vigentes.
    revogacoes_parciais:
      - dispositivos: ["art. 1º", "art. 2º", "art. 3º", "art. 4º", "art. 5º", "art. 6º", "art. 7º", "art. 8º",
                       "art. 12", "art. 13", "art. 14", "Anexo I"]
        vigencia_fim: "2024-07-08"
        revogado_por: "Resolução CONAMA 506/2024, art. 11, inciso I"
    # O DOU (in.gov.br) responde 403 a acesso automatizado; a FAOLEX (FAO) guarda a impressão da página do DOU.
    urls:
      - "https://faolex.fao.org/docs/pdf/bra215752.pdf"
      - "https://www.in.gov.br/materia/-/asset_publisher/Kujrw0TZC2Mb/content/id/51058895/do1-2018-11-21-resolucao-n-491-de-19-de-novembro-de-2018-51058603"
      - "https://conama.mma.gov.br/?option=com_sisconama&task=arquivo.download&id=740"
    busca_dou: "Resolução nº 491, de 19 de novembro de 2018"

